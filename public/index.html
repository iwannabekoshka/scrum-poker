<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrum Poker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app">
    <!-- Экран входа -->
    <div id="login-screen" class="screen active">
      <h1>🎯 Scrum Poker</h1>
      <div class="login-form">
        <input type="text" id="username-input" placeholder="Ваше имя" maxlength="20">
        <input type="text" id="room-input" placeholder="ID комнаты" maxlength="20">
        <button id="join-btn">Присоединиться</button>
        <p class="hint">Если комнаты не существует, она будет создана автоматически</p>
      </div>
    </div>

    <!-- Игровая комната -->
    <div id="game-screen" class="screen">
      <header>
        <h2>Комната: <span id="room-id"></span></h2>
        <div id="task">Оцените задачу</div>
      </header>

      <div id="users-list"></div>

      <div id="voting-section">
        <h3>Выберите карту:</h3>
        <div class="cards">
          <button class="card" data-value="0">0</button>
          <button class="card" data-value="1">1</button>
          <button class="card" data-value="2">2</button>
          <button class="card" data-value="3">3</button>
          <button class="card" data-value="5">5</button>
          <button class="card" data-value="8">8</button>
          <button class="card" data-value="13">13</button>
          <button class="card" data-value="20">20</button>
          <button class="card" data-value="40">40</button>
          <button class="card" data-value="100">100</button>
          <button class="card" data-value="?">?</button>
          <button class="card" data-value="coffee">☕</button>
        </div>
      </div>

      <div id="controls">
        <button id="reveal-btn" disabled>Показать карты</button>
        <button id="reset-btn" disabled>Новое голосование</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>

</html>
